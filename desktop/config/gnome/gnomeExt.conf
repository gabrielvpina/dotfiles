[blur-my-shell]
settings-version=2

[blur-my-shell/appfolder]
brightness=0.59999999999999998
sigma=30

[blur-my-shell/dash-to-dock]
blur=true
brightness=0.59999999999999998
sigma=30
static-blur=true
style-dash-to-dock=0

[blur-my-shell/panel]
brightness=0.59999999999999998
sigma=30

[blur-my-shell/window-list]
brightness=0.59999999999999998
sigma=30

[caffeine]
indicator-position-max=3

[display-brightness-ddcutil]
button-location=1
ddcutil-binary-path='/usr/bin/ddcutil'
ddcutil-queue-ms=130.0
ddcutil-sleep-multiplier=40.0
decrease-brightness-shortcut=['<Control>F1']
hide-system-indicator=false
increase-brightness-shortcut=['<Control>F2']
position-system-menu=3.0
show-all-slider=false
show-display-name=false
show-internal-slider=true
show-value-label=false
step-change-keyboard=10.0

[just-perfection]
animation=2
support-notifier-showed-version=34
support-notifier-type=0

[soft-brightness-plus]
current-brightness=0.70538170346623685

[space-bar/appearance]
application-styles='.space-bar {\n  -natural-hpadding: 12px;\n}\n\n.space-bar-workspace-label.active {\n  margin: 0 4px;\n  background-color: rgba(255,255,255,0.3);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,1);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}\n\n.space-bar-workspace-label.inactive.empty {\n  margin: 0 4px;\n  background-color: rgba(0,0,0,0);\n  color: rgba(255,255,255,0.5);\n  border-color: rgba(0,0,0,0);\n  font-weight: 700;\n  border-radius: 4px;\n  border-width: 0px;\n  padding: 3px 8px;\n}'

[space-bar/shortcuts]
open-menu=['<Super>z']

[space-bar/state]
version=33

[switcher]
activate-after-ms=uint32 5000
fade-enable=true
font-size=uint32 16
icon-size=uint32 16
launcher-stats='{"org.gnome.Extensions.desktop":3,"google-chrome.desktop":1,"steam.desktop":1,"spotify.desktop":1,"org.telegram.desktop.desktop":1}'
max-width-percentage=uint32 78
show-switcher=['<Control>space']

[system-monitor]
show-download=false
show-swap=false
show-upload=false

[tactile]
col-0=1
col-1=1
col-2=0
col-3=1
row-0=1
row-1=1
row-2=0

[trayIconsReloaded]
icon-brightness=0
icon-contrast=0
icon-margin-horizontal=7
icon-saturation=0
icon-size=18
icons-limit=5
tray-margin-left=4
tray-margin-right=10
wine-behavior=true

[vitals]
hot-sensors=['_processor_usage_', '_memory_usage_', '_storage_free_', '_temperature_processor_0_']
icon-style=0
update-time=3
