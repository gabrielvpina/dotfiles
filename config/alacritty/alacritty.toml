[env]
TERM = "xterm-256color"

[window.padding]
x = 10
y = 0

[window.dimensions]
columns = 140
lines = 35

[window]
opacity = 0.9

[font]
size = 14.0

[font.bold]
# family = "JetBrainsMono Nerd Font Mono"
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
# family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
# family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.normal]
# family = "JetBrainsMono Nerd Font Mono"
family = "JetBrainsMono Nerd Font"
style = "Regular"

[general]
import = [
  "~/.config/alacritty/catppuccin-mocha.toml"
]
